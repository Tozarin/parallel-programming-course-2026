<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="920" height="500" fill="white"/>
  <text x="390" y="24" text-anchor="middle" font-size="16" font-weight="bold">Пропускная способность record() (млн оп/сек, лог. шкала)</text>

  <!-- grid -->
  <g stroke="#ddd">
    <line x1="120" y1="40" x2="660" y2="40"/>
    <line x1="120" y1="92.3" x2="660" y2="92.3"/>
    <line x1="120" y1="213.8" x2="660" y2="213.8"/>
    <line x1="120" y1="266.2" x2="660" y2="266.2"/>
    <line x1="120" y1="387.7" x2="660" y2="387.7"/>
    <line x1="120" y1="440" x2="660" y2="440"/>
    <line x1="120" y1="40" x2="120" y2="440"/>
    <line x1="300" y1="40" x2="300" y2="440"/>
    <line x1="480" y1="40" x2="480" y2="440"/>
    <line x1="660" y1="40" x2="660" y2="440"/>
  </g>
  <g text-anchor="end">
    <text x="110" y="44">1000</text>
    <text x="110" y="96">500</text>
    <text x="110" y="218">100</text>
    <text x="110" y="270">50</text>
    <text x="110" y="392">10</text>
    <text x="110" y="444">5</text>
  </g>
  <g text-anchor="middle">
    <text x="120" y="460">1</text>
    <text x="300" y="460">2</text>
    <text x="480" y="460">4</text>
    <text x="660" y="460">8</text>
    <text x="390" y="485">Число потоков</text>
  </g>
  <text x="30" y="240" text-anchor="middle" transform="rotate(-90 30 240)">млн оп/сек</text>

  <!-- V0 -->
  <circle cx="120" cy="111.3" r="5" fill="#000"/>
  <!-- Empty lock -->
  <polyline fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 4" points="120,201.5 300,299.4 480,309.2 660,310.1"/>
  <!-- V1 -->
  <polyline fill="none" stroke="#d62728" stroke-width="2.5" points="120,207.4 300,303.7 480,379.7 660,387.6"/>
  <!-- V2 -->
  <polyline fill="none" stroke="#ff7f0e" stroke-width="2.5" points="120,209.6 300,326.3 480,337.5 660,336.1"/>
  <!-- V3 -->
  <polyline fill="none" stroke="#2ca02c" stroke-width="2.5" points="120,184.2 300,133.9 480,84.5 660,65.4"/>
  <!-- V4 -->
  <polyline fill="none" stroke="#1f77b4" stroke-width="2.5" points="120,208.2 300,157.7 480,108.1 660,87.6"/>

  <g>
    <g fill="#999"><circle cx="120" cy="201.5" r="3.5"/><circle cx="300" cy="299.4" r="3.5"/><circle cx="480" cy="309.2" r="3.5"/><circle cx="660" cy="310.1" r="3.5"/></g>
    <g fill="#d62728"><circle cx="120" cy="207.4" r="3.5"/><circle cx="300" cy="303.7" r="3.5"/><circle cx="480" cy="379.7" r="3.5"/><circle cx="660" cy="387.6" r="3.5"/></g>
    <g fill="#ff7f0e"><circle cx="120" cy="209.6" r="3.5"/><circle cx="300" cy="326.3" r="3.5"/><circle cx="480" cy="337.5" r="3.5"/><circle cx="660" cy="336.1" r="3.5"/></g>
    <g fill="#2ca02c"><circle cx="120" cy="184.2" r="3.5"/><circle cx="300" cy="133.9" r="3.5"/><circle cx="480" cy="84.5" r="3.5"/><circle cx="660" cy="65.4" r="3.5"/></g>
    <g fill="#1f77b4"><circle cx="120" cy="208.2" r="3.5"/><circle cx="300" cy="157.7" r="3.5"/><circle cx="480" cy="108.1" r="3.5"/><circle cx="660" cy="87.6" r="3.5"/></g>
  </g>

  <!-- legend -->
  <g transform="translate(690,60)">
    <circle cx="10" cy="0" r="5" fill="#000"/><text x="28" y="4">Этап 0: baseline</text>
    <line x1="0" y1="25" x2="20" y2="25" stroke="#999" stroke-width="2" stroke-dasharray="6 4"/><text x="28" y="29">Этап 1: пустой лок</text>
    <line x1="0" y1="50" x2="20" y2="50" stroke="#d62728" stroke-width="2.5"/><text x="28" y="54">Этап 1: общий лок</text>
    <line x1="0" y1="75" x2="20" y2="75" stroke="#ff7f0e" stroke-width="2.5"/><text x="28" y="79">Этап 2: 16 шардов</text>
    <line x1="0" y1="100" x2="20" y2="100" stroke="#2ca02c" stroke-width="2.5"/><text x="28" y="104">Этап 3: Thread-Local</text>
    <line x1="0" y1="125" x2="20" y2="125" stroke="#1f77b4" stroke-width="2.5"/><text x="28" y="129">Этап 4: двойной буфер</text>
  </g>
</svg>
